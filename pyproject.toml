[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pbcchecker"
version = "0.2.0"
description = "PBC residual checker for CalculiX: verifies *EQUATION periodic constraints against DISP from .frd"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ермиенко Иван Юрьевич" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ivanermuch-source/pbc-checker-ccx"

[project.optional-dependencies]
test = ["pytest>=8"]
report = ["matplotlib>=3.7"]   # графики/дашборд tools/metrics_report.py

[project.scripts]
pbc-check = "pbcchecker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: сквозные прогоны CLI через subprocess (медленные)"]
